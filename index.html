<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="theme-color" content="#185fa5">
<title>BuJo Habits</title>
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --blue: #185fa5;
    --green: #34c759;
    --green-dark: #0a7a52;
    --amber: #ff9500;
    --red: #a32d2d;
    --bg: #f2f2f7;
    --card: #ffffff;
    --border: #e5e5ea;
    --text: #1c1c1e;
    --text2: #6c6c70;
    --text3: #aeaeb2;
    --chip: #f2f2f7;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --card: #2c2c2e; --border: #3a3a3c;
      --text: #ffffff; --text2: #aeaeb2; --text3: #6c6c70; --chip: #3a3a3c;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: var(--bg); color: var(--text);
    padding: calc(var(--safe-top) + 16px) 16px calc(var(--safe-bottom) + 24px);
    max-width: 430px; margin: 0 auto;
  }
  .header { text-align: center; margin-bottom: 18px; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header p { font-size: 13px; color: var(--text3); margin-top: 2px; }

  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px;
    background: var(--card); border-radius: 12px; padding: 4px; border: 1px solid var(--border); }
  .tab { padding: 10px 8px; border-radius: 9px; border: none; background: transparent; cursor: pointer; }
  .tab.active { background: var(--blue); }
  .tab-label { display: block; font-size: 14px; font-weight: 600; color: var(--text2); }
  .tab.active .tab-label { color: #fff; }
  .tab-date { display: block; font-size: 12px; color: var(--text3); margin-top: 1px; }
  .tab.active .tab-date { color: rgba(255,255,255,0.7); }

  .habit { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .habit.done { border-color: #a8dcc4; }
  .habit.skip { border-color: #ffd060; }
  .habit-top { display: flex; align-items: center; gap: 14px; cursor: pointer; user-select: none; -webkit-user-select: none; }
  .habit-info { flex: 1; }
  .habit-name { font-size: 16px; font-weight: 600; }
  .habit-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .habit.done .habit-sub { color: #2a9b6a; }
  .habit.skip .habit-sub { color: #c07800; }
  .badge { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; background: var(--border); color: var(--text3); flex-shrink: 0; }
  .habit.done .badge { background: var(--green); color: #fff; }
  .habit.skip .badge { background: var(--amber); color: #fff; }

  .details { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); display: none; }
  .habit.done .details { display: block; }
  .row-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin: 8px 0 6px; }
  .row-label:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 8px 12px; border-radius: 18px; border: 1px solid var(--border); background: var(--chip);
    color: var(--text); font-size: 14px; cursor: pointer; }
  .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  input.text { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--chip); color: var(--text); font-size: 15px; font-family: inherit; }
  input.mins { width: 72px; padding: 8px 10px; border-radius: 18px; text-align: center; }

  .preview { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin: 4px 0 14px; }
  .preview-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .preview-text { font-family: 'SF Mono', Menlo, monospace; font-size: 12px; color: var(--text2); line-height: 1.6; word-break: break-word; }

  .btn-primary { display: block; width: 100%; padding: 15px; background: var(--blue); color: #fff; border: none;
    border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .btn-primary.success { background: var(--green-dark); }
  .status-msg { text-align: center; margin-top: 10px; font-size: 13px; min-height: 18px; color: var(--text3); }
  .status-msg.ok { color: var(--green-dark); }
  .foot { text-align: center; font-size: 12px; color: var(--text3); margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>

<div class="header">
  <h1>BuJo Habits</h1>
  <p>Harmonica + Movement · tap a card to cycle not done → done → skip</p>
</div>

<div class="tabs">
  <button class="tab active" id="tab-0" onclick="switchTab(0)">
    <span class="tab-label">Yesterday</span><span class="tab-date" id="date-0"></span>
  </button>
  <button class="tab" id="tab-1" onclick="switchTab(1)">
    <span class="tab-label">Today</span><span class="tab-date" id="date-1"></span>
  </button>
</div>

<div id="habits"></div>

<div class="preview">
  <div class="preview-label">Email preview</div>
  <div class="preview-text" id="preview-text"></div>
</div>

<button class="btn-primary" id="send-btn" onclick="sendEmail()">✉ Email to BuJo</button>
<p class="status-msg" id="status"></p>
<p class="foot">Duolingo and Harmonica School keep their own streaks, so they're not logged here.</p>

<script>
const HARP_MINS = [5, 10, 15, 20, 30, 45];
const MOVE_MINS = [10, 15, 20, 30, 45, 60];
const ACTIVITIES = ['Walk', 'Stretch', 'Wii Fit', 'Total Gym', 'Treadmill', 'eBike', 'Yardwork'];
const STATES  = ['none', 'done', 'skip'];
const SYMBOLS = { none: '·', done: '✓', skip: '–' };
const BADGES  = { none: '○', done: '✓', skip: '−' };
const LABELS  = { none: 'not done', done: 'done', skip: 'skipped' };
const DAYS    = ['Su','Mo','Tu','We','Th','Fr','Sa'];

function blank() {
  return { harp: { st: 'none', mins: null, next: '' }, move: { st: 'none', mins: null, act: '' } };
}
const data = [blank(), blank()];
const emailed = [false, false];
let tab = 0;

function dateLabel(offset) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return `${DAYS[d.getDay()]} ${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
const dates = [dateLabel(-1), dateLabel(0)];
document.getElementById('date-0').textContent = dates[0];
document.getElementById('date-1').textContent = dates[1];

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function switchTab(i) {
  tab = i;
  [0,1].forEach(k => document.getElementById('tab-'+k).classList.toggle('active', k === i));
  render();
}
function changed() { emailed[tab] = false; updatePreview(); syncBtn(); }
function cycle(key) {
  const h = data[tab][key];
  h.st = STATES[(STATES.indexOf(h.st) + 1) % STATES.length];
  emailed[tab] = false; render();
}
function setMins(key, m) {
  const h = data[tab][key]; h.mins = (h.mins === m) ? null : m; render(); changed();
}
function setCustomMins(key, v) {
  const n = parseInt(v, 10); data[tab][key].mins = isNaN(n) || n <= 0 ? null : n;
  document.querySelectorAll(`[data-mins-of="${key}"]`).forEach(c => c.classList.toggle('on', +c.dataset.m === data[tab][key].mins));
  changed();
}
function setAct(a) { const m = data[tab].move; m.act = (m.act === a) ? '' : a; render(); changed(); }
function setNext(v) { data[tab].harp.next = v; changed(); }

function buildMessage() {
  const d = data[tab];
  let harp = `Harp ${SYMBOLS[d.harp.st]}`;
  if (d.harp.st === 'done') {
    if (d.harp.mins) harp += ` ${d.harp.mins}m`;
    if (d.harp.next.trim()) harp += ` (next: ${d.harp.next.trim()})`;
  }
  let move = `Move ${SYMBOLS[d.move.st]}`;
  if (d.move.st === 'done') {
    if (d.move.act) move += ` ${d.move.act}`;
    if (d.move.mins) move += ` ${d.move.mins}m`;
  }
  return `Bujo - habits for ${dates[tab]}: ${harp} · ${move}`;
}

function minsChips(key, list) {
  const cur = data[tab][key].mins;
  const custom = cur && !list.includes(cur) ? cur : '';
  return `<div class="chips">` +
    list.map(m => `<button class="chip ${cur === m ? 'on' : ''}" data-mins-of="${key}" data-m="${m}" onclick="setMins('${key}', ${m})">${m}m</button>`).join('') +
    `<input class="text mins" type="number" inputmode="numeric" min="1" placeholder="other" value="${custom}" oninput="setCustomMins('${key}', this.value)" aria-label="Other minutes">` +
    `</div>`;
}

function card(key, title, sub, detailsHtml) {
  const st = data[tab][key].st;
  return `<div class="habit ${st === 'none' ? '' : st}">
    <div class="habit-top" role="button" tabindex="0" aria-label="${title}: ${LABELS[st]}. Tap to change."
         onclick="cycle('${key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();cycle('${key}')}">
      <div class="habit-info"><div class="habit-name">${title}</div><div class="habit-sub">${LABELS[st]} · ${sub}</div></div>
      <div class="badge" aria-hidden="true">${BADGES[st]}</div>
    </div>
    <div class="details">${detailsHtml}</div>
  </div>`;
}

function render() {
  const d = data[tab];
  const harpDetails = `<div class="row-label">Minutes</div>${minsChips('harp', HARP_MINS)}
    <div class="row-label">Start here next time (optional)</div>
    <input class="text" type="text" placeholder="e.g. Freight Train, verse 2" value="${esc(d.harp.next)}" oninput="setNext(this.value)">`;
  const moveDetails = `<div class="row-label">What</div><div class="chips">` +
    ACTIVITIES.map(a => `<button class="chip ${d.move.act === a ? 'on' : ''}" onclick="setAct('${a}')">${a}</button>`).join('') +
    `</div><div class="row-label">Minutes</div>${minsChips('move', MOVE_MINS)}`;
  document.getElementById('habits').innerHTML =
    card('harp', '🪗 Harmonica', 'own practice, not School', harpDetails) +
    card('move', '🏃 Movement', 'walk, stretch, Wii Fit…', moveDetails);
  updatePreview(); syncBtn();
}
function updatePreview() { document.getElementById('preview-text').textContent = buildMessage(); }

function syncBtn() {
  const btn = document.getElementById('send-btn'), msg = document.getElementById('status');
  if (emailed[tab]) {
    btn.className = 'btn-primary success'; btn.textContent = 'Sent ✓ — the sweep picks it up';
    msg.className = 'status-msg ok'; msg.textContent = "Check your Drafts if Mail didn't open.";
  } else {
    btn.className = 'btn-primary'; btn.textContent = '✉ Email to BuJo';
    msg.className = 'status-msg'; msg.textContent = '';
  }
}

function sendEmail() {
  const message = buildMessage();
  const subject = encodeURIComponent(`Bujo - habits for ${dates[tab]}`);
  window.location.href = `mailto:prusso@decisiv.com?subject=${subject}&body=${encodeURIComponent(message)}`;
  setTimeout(() => { emailed[tab] = true; syncBtn(); }, 800);
}

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(() => {}); }
render();
</script>
</body>
</html>
